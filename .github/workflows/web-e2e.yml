name: Keyless Web E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DSH_WEB_URL: http://127.0.0.1:3080
      DSH_TELEMETRY_DISABLED: "1"
      DSH_BIN: ${{ github.workspace }}/dsh-source/apps/cli/lib/bin.js
    steps:
      - name: Check out LearnLoop
        uses: actions/checkout@v4
      - name: Check out pinned DeepSeek Harness source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 141eb6fef83422698aef7a981029e843e8161534
          path: dsh-source
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install LearnLoop and DSH dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir dsh-source install --frozen-lockfile
      - name: Build pinned DSH and LearnLoop
        run: |
          pnpm --dir dsh-source run build
          pnpm run build
      - name: Install Playwright Chromium
        run: node ./node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Block real DeepSeek endpoints
        run: |
          printf '127.0.0.1 api.deepseek.com\n127.0.0.1 api.deepseek.com.cn\n' | sudo tee -a /etc/hosts
      - name: Start deterministic mock provider
        run: |
          pnpm --dir dsh-source run mock:llm -- \
            --host 127.0.0.1 \
            --port 8000 \
            --sequence success \
            --repeat-last \
            --success-text 'Mock LearnLoop teaching response.' \
            >mock-provider.log 2>&1 &
          echo $! >mock-provider.pid
          mock_provider_pid="$(cat mock-provider.pid)"
          if ! timeout 60 bash -c '
            until curl --silent --output /dev/null http://127.0.0.1:8000/; do
              kill -0 "$1" 2>/dev/null || exit 1
              sleep 1
            done
          ' _ "$mock_provider_pid"; then
            echo "Mock provider did not become ready; provider output follows:" >&2
            cat mock-provider.log >&2
            exit 1
          fi
      - name: Prepare isolated DSH profile
        run: pnpm run acceptance:prepare
      - name: Start DSH Web on loopback
        run: |
          node "$DSH_BIN" web --patch e2e/fixtures/mock-provider.patch.yml --host 127.0.0.1 --port 3080 --no-open >dsh-web.log 2>&1 &
          echo $! >dsh-web.pid
          timeout 60 bash -c 'until curl --fail --silent http://127.0.0.1:3080/ >/dev/null; do sleep 1; done'
      - name: Run LearnLoop browser acceptance
        run: pnpm run acceptance:test
      - name: Stop background services
        if: always()
        run: |
          test ! -f dsh-web.pid || kill "$(cat dsh-web.pid)" 2>/dev/null || true
          test ! -f mock-provider.pid || kill "$(cat mock-provider.pid)" 2>/dev/null || true
      - name: Upload browser reports, screenshots, traces, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnloop-web-e2e-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            mock-provider.log
            dsh-web.log
