name: Keyless Web E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DSH_TELEMETRY_DISABLED: "1"
      DSH_BIN: ${{ github.workspace }}/deepseek-harness/apps/cli/lib/bin.js
      LEARNLOOP_INTERVIEW_E2E: "1"
    steps:
      - name: Check out LearnLoop
        uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Check out and build pinned DSH
        uses: ./.github/actions/setup-dsh
      - name: Print compatibility baseline
        run: |
          echo "LearnLoop commit: $(git rev-parse HEAD)"
          node -e "const b=require('./scripts/dsh-baseline.json'); console.log('DSH version:',b.version); console.log('DSH commit:',b.commit)"
          echo "Node version: $(node --version)"
          echo "pnpm version: $(pnpm --version)"
      - name: Install LearnLoop
        run: pnpm install --frozen-lockfile
      - name: Build LearnLoop
        run: pnpm run build
      - name: Install Playwright Chromium
        run: node ./node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Block real DeepSeek endpoints
        run: |
          printf '127.0.0.1 api.deepseek.com\n127.0.0.1 api.deepseek.com.cn\n' | sudo tee -a /etc/hosts
      - name: Run keyless web E2E with isolated lifecycle
        run: pnpm run e2e:keyless:web
      - name: Upload browser reports, screenshots, traces, and logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: learnloop-web-e2e-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            mock-provider.log
            dsh-web.log
            fixture-setup.log
