name: CI
on:
  pull_request:
  push:
    branches: [main, work]
permissions:
  contents: read
jobs:
  build-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: {version: 11.7.0, run_install: false}
      - uses: actions/setup-node@v5
        with: {node-version: 22.19.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: |
          echo "LearnLoop commit: $(git rev-parse HEAD)"
          node -e "const b=require('./scripts/dsh-baseline.json'); console.log('DSH version:',b.version); console.log('DSH commit:',b.commit)"
          echo "Node version: $(node --version)"
          echo "pnpm version: $(pnpm --version)"
      - run: pnpm run verify:dsh-baseline
      - run: pnpm run build
      - run: pnpm run typecheck
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: {version: 11.7.0, run_install: false}
      - uses: actions/setup-node@v5
        with: {node-version: 22.19.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
  unit-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: {version: 11.7.0, run_install: false}
      - uses: actions/setup-node@v5
        with: {node-version: 22.19.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit
  unit-runtime-http-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: {version: 11.7.0, run_install: false}
      - uses: actions/setup-node@v5
        with: {node-version: 22.19.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:integration
      - run: pnpm run test:runtime
      - run: pnpm run test:upstream-contract
      - run: pnpm run test:prompt
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: {version: 11.7.0, run_install: false}
      - uses: actions/setup-node@v5
        with: {node-version: 22.19.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run package:validate
